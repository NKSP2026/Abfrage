<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NABS – System</title><link rel="stylesheet" href="style.css"></head><body class="launcher-body"><header class="launcher-menubar"><div class="menu-left"><span><span class="nabs-logo-mini" aria-label="NABS">N</span></span><span>System</span><span>Systemstatus</span></div><div class="menu-right"><a href="index.html">Start</a></div></header><main class="module-wrap"><section class="module-head"><div><div class="ils-kicker">SYSTEM</div><h1>Systemstatus</h1><p>Technische Informationen und Anmeldung.</p></div></section><div class="quality-panel" id="systemInfo"></div><div class="module-actions"><a class="button secondary" href="qm1.html">‹ Zurück QM1</a><a class="button secondary" href="index.html">Launcher</a></div></main><script type="module">
import{authState,logout,read}from'./firebase-rest.js?v=20260921v50';
const a=authState();
const labels={medizin:'🚑 Medizin',feuerwehr:'🔥 Feuerwehr',verkehrsunfall:'🚗 Verkehrsunfall',wasserunfall:'🌊 Wasserunfall',aufzug:'🛗 Aufzug',grossschaden:'🚨 Großschaden',abc:'☣️ Gefahrgut'};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
async function render(){
  let events={};
  if(a.admin){try{events=await read('nutzungsereignisse')||{};}catch(e){console.warn(e);}}
  const counts={};
  Object.values(events).forEach(e=>{const k=e?.category||'sonstiges';counts[k]=(counts[k]||0)+1;});
  const keys=['medizin','feuerwehr','verkehrsunfall','wasserunfall','aufzug','grossschaden','abc'];
  const cards=keys.map(k=>`<div class="quality-stat-card"><b>${labels[k]||k}</b><span>${counts[k]||0}</span><small>Abfragen gestartet</small></div>`).join('');
  document.getElementById('systemInfo').innerHTML='<div class="quality-grid"><div><b>Benutzergruppe</b><span>'+(a.admin?'Administrator':'Einsatzbearbeiter')+'</span></div><div><b>Firebase</b><span>'+(a.token?'angemeldet':'nicht angemeldet')+'</span></div><div><b>Version</b><span>NABS-Einsatzabfrage V29</span></div><div><b>Browser</b><span>'+navigator.userAgent.replace(/</g,'&lt;')+'</span></div></div><h2 style="margin-top:24px">📈 Abfragen-Zähler</h2><p class="hint">Gezählt wird jeder Start einer Abfrage. Die Werte werden in Firebase protokolliert.</p><div class="quality-grid usage-grid">'+cards+'</div><div class="module-actions"><button class="button secondary" id="logout">Abmelden</button><button class="button secondary" id="close">Programm schließen</button></div>';
  document.getElementById('logout').onclick=()=>{logout();location.href='index.html'};
  document.getElementById('close').onclick=()=>{window.open('','_self');window.close();setTimeout(()=>alert('Der Browser verhindert das automatische Schließen. Das Fenster kann dann manuell geschlossen werden.'),300);};
}
render();
</script></body></html>
