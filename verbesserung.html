<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NABS – Verbesserungsvorschlag</title><link rel="stylesheet" href="style.css"></head><body class="launcher-body"><header class="launcher-menubar"><div class="menu-left"><span class="nabs-logo-mini" aria-label="NABS">N</span><strong>Notruf-Abfrage- und Bearbeitungssystem</strong><span>Verbesserung</span></div><div class="menu-right"><a href="index.html">Launcher</a></div></header><main class="module-wrap"><section class="module-head"><div><div class="ils-kicker">NABS · VERBESSERUNG</div><h1>Verbesserungsvorschlag</h1><p>Hier kannst du jederzeit einen Vorschlag zur Verbesserung von NABS, der Notrufabfrage oder der EHSI-Einsatzhilfe senden.</p></div></section><section class="quality-panel"><form id="improvementForm"><div class="form-grid"><label>Betreff<input id="suggestionTitle" class="modal-input" maxlength="160" required placeholder="Kurzer Titel …"></label><label>Bereich<select id="suggestionCategory" class="modal-input"><option value="medizin">🚑 Rettungsdienst / Medizin</option><option value="brand">🔥 Feuerwehr</option><option value="thl">🛠️ Technische Hilfeleistung</option><option value="abc">☣️ Gefahrgut / ABC</option><option value="leitstelle">📞 Leitstelle / Region</option><option value="tiere">🐝 Tiere / Natur & Zuständigkeiten</option><option value="ehsi">📚 EHSI / Einsatzhilfe</option><option value="allgemein" selected>⚙️ Allgemein / NABS</option></select></label></div><label>Verbesserungsvorschlag<textarea id="suggestionText" class="modal-textarea" rows="8" maxlength="4000" required placeholder="Was sollte geändert, ergänzt oder verbessert werden? …"></textarea></label><div id="contextBox" class="module-note" hidden></div><div class="module-actions"><button id="sendSuggestion" class="button" type="submit">📤 Vorschlag senden</button><a class="button secondary" href="index.html">Abbrechen</a></div><p id="suggestionStatus" class="hint"></p></form></section></main><script type="module" src="verbesserung.js?v=20260920v1"></script></body></html>
