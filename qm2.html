<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NABS – QM2</title><link rel="stylesheet" href="style.css"></head><body class="launcher-body"><header class="launcher-menubar"><div class="menu-left"><span><span class="nabs-logo-mini" aria-label="NABS">N</span></span><span>QM2</span><span>Qualität & Auswertung</span></div><div class="menu-right"><a href="index.html">Start</a></div></header><main class="module-wrap"><section class="module-head"><div><div class="ils-kicker">QM2 · QUALITÄT</div><h1>Auswertung & Qualitätskontrolle</h1><p>Übersicht über die zuletzt lokal gespeicherte Abfrage und technische Prüfpunkte.</p></div></section><section id="qmResult" class="quality-panel"></section><div class="module-actions"><a class="button secondary" href="qm1.html">‹ Zurück QM1</a><a class="button secondary" href="index.html">Launcher</a></div></main><script>const el=document.getElementById('qmResult');let r=null;try{r=JSON.parse(sessionStorage.getItem('einsatzabfrage_result')||'null')}catch{};if(!r){el.innerHTML='<h2>Noch kein Ergebnis vorhanden</h2><p>Nach einer Abfrage erscheint hier das letzte Ergebnis dieser Sitzung.</p>';}else{el.innerHTML='<h2>Letzte Abfrage</h2><div class="quality-grid"><div><b>Einsatzart</b><span>'+String(r.categoryTitle||'')+'</span></div><div><b>Abfragezeit</b><span>'+String(r.abfragedauer||'')+'</span></div><div><b>Fragen beantwortet</b><span>'+String(r.questionsAnswered??'')+'</span></div><div><b>Einsatzstichwort</b><span>'+String(r.stichwort?.code||'—')+' – '+String(r.stichwort?.name||'')+'</span></div><div><b>NEF-Hinweis</b><span>'+((r.reasons||[]).length?'Ja':'Nein')+'</span></div><div><b>Teilergebnis</b><span>'+((r.partialExit)?'Ausstieg / Teilabfrage':'vollständiges Ergebnis')+'</span></div></div><h3>Einsatztext</h3><pre>'+String(r.dispatchText||'')+'</pre>';}</script></body></html>
