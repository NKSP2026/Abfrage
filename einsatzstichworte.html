<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Einsatzstichworte</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div><h1>📟 Einsatzstichworte</h1><div id="status">Wird geladen …</div></div><div class="top-actions"><button id="loginBtn" class="secondary">🔐 Anmelden</button><button id="logoutBtn" class="secondary">Abmelden</button><a class="button secondary" href="fragen.html">🧩 Fragen</a><a class="button secondary" href="index.html">🏠 Startseite</a></div></header>
<main class="container"><section class="card"><h2>Einsatzstichwort verwalten</h2><p class="hint">Bedingungen werden als <b>Frage-ID=Wert</b> eingetragen. Mehrere mögliche Werte mit <b>|</b>. Jede Zeile ist eine UND-Bedingung. Die höchste Priorität gewinnt.</p>
<div class="form-grid"><label>ID<input id="id" placeholder="B3_PERSON"></label><label>Code<input id="code" placeholder="B3-PERSON"></label><label>Bezeichnung<input id="name" placeholder="Wohnungsbrand – Personen in Gefahr"></label><label>Kategorie<select id="category"><option value="brand">Brand</option><option value="medizin">Medizin</option><option value="thl">Technische Hilfe</option><option value="abc">ABC</option></select></label><label>Priorität<input id="priority" type="number" value="0"></label><label class="wide">Bedingungen<textarea id="conditions" placeholder="objekt=Wohngebäude / Wohnung&#10;feuersichtbar=Ja&#10;personen_im_objekt=Ja"></textarea></label></div>
<div class="nav-row"><button id="save">💾 Stichwort speichern</button><button id="new" class="secondary">Neu</button></div></section><section class="card"><h3>Vorhandene Einsatzstichworte</h3><div id="list"></div></section></main><script type="module" src="stichworte.js?v=20260914v16"></script></body></html>
